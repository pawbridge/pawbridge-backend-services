name: Claude PR review

# Trial: Claude reviews a pull request into dev once, when it is opened or leaves draft, and
# posts its findings as inline comments (or one summary comment when it finds nothing).
# It does not run again on later pushes and it never changes code. Pull requests into main are
# not reviewed: a release carries commits that were already reviewed on their way into dev.
#
# To review again after fixes, convert the pull request to draft and mark it ready again
# (`gh pr ready <number> --undo`, then `gh pr ready <number>`). A label trigger is not used on
# purpose: every other label would rerun this workflow and leave a skipped check behind.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (created with `claude setup-token`), so
# the review runs on a Claude subscription. Without the secret this job fails; it is not
# turned into a pass.
#
# Comments are posted as claude[bot]: the action trades this job's OIDC token for a token of
# the Claude GitHub App, which is installed on the organization. That token is only issued
# when this file is identical on the default branch (main). So:
#   - after changing this file, release dev into main right away; until main has the same
#     file, the review of every pull request into dev is skipped;
#   - a pull request that changes this file is never reviewed itself.
#
# The action ends successfully when it skips a review. The last step turns a review that did
# not run into a failure, except on a pull request that changes this file, where the skip is
# expected and only a warning is written.

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Skip drafts, pull requests from forks (they get no secrets) and main merged back into dev.
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review the pull request with Claude
        id: review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: >-
            --model claude-opus-5-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "PR에 남기는 모든 코멘트는 한국어로 쓴다. 이 PR에 이전 자동 리뷰 코멘트가 있어도 리뷰를 건너뛰지 않는다. 그때는 이전 지적이 고쳐졌는지 확인하고, 아직 남은 문제와 새 문제만 코멘트하며, 이미 달린 것과 같은 지적을 다시 달지 않는다."

      - name: Fail when the review did not run
        env:
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$REVIEW_CONCLUSION" = success ]; then
            exit 0
          fi
          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$changed" | grep -qxF '.github/workflows/claude-pr-review.yml'; then
            echo '::warning::This pull request changes the review workflow, so Claude did not review it. Release dev into main after merging.'
            exit 0
          fi
          printf 'Claude review conclusion: "%s". The review was skipped or did not finish.\n' "$REVIEW_CONCLUSION" >&2
          exit 1
